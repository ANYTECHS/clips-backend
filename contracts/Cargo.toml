[package]
name = "clip-cash-nft"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.5.0"
soroban-token-sdk = "21.5.0"

[dev-dependencies]
soroban-sdk = { version = "21.5.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
